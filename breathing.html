<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Booth — HELPFUL</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">

  <!-- Site CSS (nav, tokens, fonts) -->
  <link rel="stylesheet" href="style.css?v=2">

  <!-- Photo booth styles live in style.css, under "PHOTO BOOTH" -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2B2B2B">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HELPFUL">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>

<body>

  <!--  NAV  -->
  <nav class="nav-bar">
    <div></div>
    <a class="nav-logo" href="index.html" aria-label="HELPFUL — back to home">HELPFUL</a>
    <button class="hamburger" id="menuBtn" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <div class="overlay" id="overlay"></div>
  <div class="side-menu" id="sideMenu">
    <button class="menu-close" id="menuClose">✕</button>
    <a href="index.html">Home</a>
    <a href="timer.html">5 Min Timer</a>
    <a href="tasks.html">Task Manager</a>
    <a href="breathing.html">Photo Booth</a>
  </div>

  <!--  BOOTH  -->
  <main class="booth-page">
    <h1 class="booth-title">Photo Booth</h1>
    <p class="booth-sub">Four shots, three seconds each. Smile — you've earned a break.</p>

    <div class="booth-grid">

      <!-- camera -->
      <div class="stage-col">
        <div class="stage idle" id="stage">
          <video id="video" playsinline muted autoplay></video>
          <div class="stage-msg" id="stageMsg">
            <div class="big">📸</div>
            <div id="stageMsgText">Tap <strong>Start camera</strong> to begin,<br>or upload photos instead.</div>
          </div>
          <div class="countdown" id="countdown"></div>
          <div class="shot-pip" id="shotPip">Shot 1 of 4</div>
        </div>

        <div class="controls">
          <div class="btn-row">
            <button class="bth bth-primary" id="startBtn">Start camera</button>
            <button class="bth bth-soft" id="uploadBtn">Upload photos</button>
            <input type="file" id="fileInput" accept="image/*" multiple hidden>
          </div>

          <div class="filters">
            <span class="filters-label">Filter</span>
            <button class="chip" data-filter="none" aria-pressed="true">Original</button>
            <button class="chip" data-filter="bw">B&amp;W</button>
            <button class="chip" data-filter="warm">Warm</button>
            <button class="chip" data-filter="cool">Cool</button>
            <button class="chip" data-filter="pop">Pop</button>
            <button class="chip" data-filter="dream">Dreamy</button>
          </div>

          <!-- Sticker tray. The buttons are built by script.js from the
               STICKER_FILES list, reading PNGs out of the stickers/ folder. -->
          <div class="stickers">
            <span class="filters-label">Stickers — tap to add, then drag</span>
            <div class="sticker-tray" id="stickerTray"></div>

            <!-- upload your own PNGs straight from your device -->
            <button class="bth bth-soft sticker-clear" id="stickerUploadBtn">
              Upload sticker
            </button>
            <input type="file" id="stickerUpload" accept="image/png,image/*" multiple hidden>

            <!-- hidden until at least one sticker is on the strip -->
            <button class="bth bth-soft sticker-clear" id="clearStickersBtn" hidden>
              Remove stickers
            </button>
          </div>
        </div>
      </div>

      <!-- strip -->
      <div class="strip-col">
        <div class="strip" id="strip">
          <div class="slot" data-i="0"><span class="slot-num">1</span></div>
          <div class="slot" data-i="1"><span class="slot-num">2</span></div>
          <div class="slot" data-i="2"><span class="slot-num">3</span></div>
          <div class="slot" data-i="3"><span class="slot-num">4</span></div>
          <div class="strip-foot" id="stripFoot">HELPFUL</div>
        </div>

        <div class="strip-actions">
          <button class="bth bth-primary" id="downloadBtn" disabled>Download</button>
          <button class="bth bth-soft" id="clearBtn" disabled>Clear</button>
        </div>
      </div>

    </div>
  </main>

  <!-- full-screen shutter flash — sits outside the camera box so it can
       cover the whole window and light up your face -->
  <div class="booth-flash" id="flash"></div>

  <div class="booth-toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Photo booth behaviour lives in script.js -->
  <script src="script.js?v=2" defer></script>
</body>
</html>
